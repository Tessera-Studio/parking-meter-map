<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>パーキング・メーター・マップ</title>
<meta name="description" content="東京・大阪・京都・札幌のパーキング・メーター／パーキング・チケットの設置区間を地図で探せます。各都道府県警察の公開情報を使っています。">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-title" content="パーキング・メーター・マップ">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="vendor/leaflet.css?v=ec929f11">
<link rel="stylesheet" href="styles.css?v=cc74a6d0">
</head>
<body>

<header class="mast">
  <h1><span class="sub">ON-STREET PARKING · JAPAN</span>パーキング・メーター・マップ</h1>
  <button class="roundbtn" id="searchBtn" aria-label="地名・駅名で探す（停車中に）">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
  </button>
  <span class="spacer"></span>
  <button class="menubtn" id="menuBtn" aria-label="メニュー" aria-expanded="false" aria-controls="menu">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <nav class="menu" id="menu" hidden>
    <button id="menuList"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>一覧で見る</button>
    <div id="menuPrefs"></div>
    <button id="menuFit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>全体を表示</button>
    <button id="menuMode"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l6 16-6-4-6 4z"/></svg><span id="menuModeText">運転モード</span></button>
    <a href="https://parking-meter.jp/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>警視庁の地図</a>
  </nav>
</header>

<main class="mapwrap">
  <div id="map"></div>

  <div class="topbar">
    <form class="search" id="qform" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="地名・駅名で探す（例：銀座）" aria-label="地名・駅名で探す" aria-controls="qpanel">
      <button type="button" class="qclose" id="qclose" aria-label="検索を閉じる">×</button>
    </form>
    <div class="qpanel" id="qpanel" hidden></div>
    <div class="qnote" id="qnote" hidden></div>
    <div class="barrow">
      <button class="ftoggle" id="ftoggle" aria-expanded="false" aria-controls="filters">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4"/></svg>
        条件<span class="fcount" id="fcount" hidden>0</span>
      </button>
      <button class="qchip" type="button" data-q="at" data-v="now" aria-pressed="false">いま使える</button>
      <button class="qchip" type="button" data-q="days" data-v="daily" aria-pressed="false">土日祝も可</button>
      <span class="count"><b id="n">0</b> 区間</span>
    </div>

    <div class="filters" id="filters" hidden>
      <div class="fsec"><span class="fl"><i>1</i>都府県</span><div class="chips" data-for="pref"></div><select id="pref" class="vh" aria-label="都府県"></select></div>
      <label class="fsec row"><span class="fl"><i>2</i>区・市</span><select id="ward" disabled></select></label>
      <label class="fsec row"><span class="fl"><i>3</i>町名</span><select id="town" disabled></select></label>
      <div class="fsec"><span class="fl"><i>4</i>曜日</span><div class="chips seg" data-for="days"></div>
        <select id="days" class="vh" aria-label="曜日">
          <option value="">すべて</option>
          <option value="daily">土日祝も使える</option>
          <option value="closed">日祝は除く</option>
        </select>
      </div>
      <label class="fsec row"><span class="fl"><i>5</i>時間帯</span>
        <select id="at">
          <option value="">すべて</option>
          <option value="now">いま使える</option>
        </select>
      </label>
      <div class="fsec"><span class="fl"><i>6</i>制限時間</span><div class="chips" data-for="limit"></div>
        <select id="limit" class="vh" aria-label="制限時間">
          <option value="">すべて</option>
          <option value="20">20分まで</option>
          <option value="40">40分まで</option>
        </select>
      </div>
      <div class="fsec"><span class="fl"><i>7</i>車種</span><div class="chips" data-for="vehicle"></div>
        <select id="vehicle" class="vh" aria-label="車種">
          <option value="">すべて</option>
          <option value="truck">貨物用あり</option>
          <option value="bike">二輪車</option>
        </select>
      </div>
      <p class="fnote" id="fnote"></p>
      <div class="factions">
        <button class="linkbtn" id="freset" type="button">条件をクリア</button>
        <button class="btn primary" id="fdone" type="button"><span id="n2">0</span> 区間を表示</button>
      </div>
    </div>
  </div>

  <section class="drivecard" id="drivecard" aria-label="近くのいま使える区間">
    <p class="drivenote" id="drivenote"></p>
    <ol class="drivelist" id="drivelist"></ol>
    <a class="gobtn" id="drivego" target="_blank" rel="noopener" hidden></a>
  </section>

  <div class="mapbtns">
    <button class="mapbtn" id="openList" aria-label="一覧で見る"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
    <button class="mapbtn" id="locate" aria-label="現在地"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
  </div>
  <div class="legend">
    <div class="lrow"><span class="k daily"></span>土日祝も可</div>
    <div class="lrow"><span class="k closed"></span>日祝は除く</div>
    <div class="lrow"><span class="k plain ticket"></span>チケット</div>
    <div class="lrow"><span class="k unknown"></span>時間は現地で確認</div>
  </div>
</main>

<aside class="listpanel" id="listpanel" aria-label="一覧" hidden>
  <div class="listhead">
    <button class="close" id="listClose" aria-label="一覧を閉じる">×</button>
    <h2>一覧</h2>
    <small><span id="n3">0</span>件</small>
  </div>
  <div class="tabs" role="tablist" aria-label="並べ方">
    <button role="tab" data-sort="near" aria-selected="true">近い順</button>
    <button role="tab" data-sort="area" aria-selected="false">エリアごと</button>
  </div>
  <p class="sortnote" id="sortnote"></p>
  <ul class="list" id="list"></ul>
</aside>

<div class="empty" id="empty" hidden>
  <div class="card">
    <h2>区間データを読み込めませんでした</h2>
    <p>通信状態を確かめて、ページを読み込み直してください。</p>
  </div>
</div>

<aside class="detail" id="detail" aria-label="区間の詳細"></aside>

<script src="config.js?v=64f92221"></script>
<script src="vendor/leaflet.js?v=5a640ff8"></script>
<script src="zones.js?v=0a80f9b4"></script>
<script src="app.js?v=c33b94e6"></script>
</body>
</html>
