<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>パーキング・メーター・マップ</title>
<meta name="description" content="東京・大阪・京都・札幌・神奈川のパーキング・メーター／パーキング・チケットが、いま（または指定した日時に）停められるかを地図と一覧で調べられます。">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-title" content="パーキング・メーター・マップ">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="vendor/leaflet.css?v=ec929f11">
<link rel="stylesheet" href="styles.css?v=4e66e7c0">
</head>
<body>

<main class="app">
  <div id="map"></div>

  <div class="topbar">
    <form class="search" id="qform" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="場所・駅名（例：銀座）" aria-label="場所・駅名で探す" aria-controls="qpanel">
    </form>
    <div class="qpanel" id="qpanel" hidden></div>
    <div class="when" role="group" aria-label="いつ停めるか">
      <button class="chip" type="button" id="whenNow" aria-pressed="true">いま</button>
      <button class="chip" type="button" id="whenPick" aria-pressed="false">日時を指定</button>
      <span class="whenset" id="whenSet" hidden>
        <select id="whenDay" aria-label="日"></select>
        <select id="whenHour" aria-label="時刻"></select>
      </span>
    </div>
  </div>

  <button class="mapbtn" id="locate" aria-label="現在地へ"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>

  <section class="sheet" id="sheet" aria-label="近くの区間">
    <button class="grip" id="grip" type="button" aria-label="一覧を広げる" aria-expanded="false"><span></span></button>
    <div class="sheetbody" id="sheetBody"></div>
  </section>

  <div class="empty" id="empty" hidden>
    <div class="card">
      <h2>区間データを読み込めませんでした</h2>
      <p>通信状態を確かめて、ページを読み込み直してください。</p>
    </div>
  </div>
</main>

<script src="config.js?v=64f92221"></script>
<script src="vendor/leaflet.js?v=5a640ff8"></script>
<script src="zones.js?v=0a80f9b4"></script>
<script src="app.js?v=49f8e5a2"></script>
</body>
</html>
