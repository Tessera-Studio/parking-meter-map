<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>パーキング・メーター・マップ</title>
<meta name="description" content="東京・大阪・京都・札幌・神奈川のパーキング・メーター／パーキング・チケットの区間と、いま（または指定した日時に）使える時間を地図で調べられます。">
<meta name="theme-color" content="#ECEAE4">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-title" content="パーキング・メーター・マップ">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="vendor/maplibre-gl.css?v=afb6efe2">
<link rel="stylesheet" href="vendor/leaflet.css?v=ec929f11">
<link rel="stylesheet" href="styles.css?v=3032b4cd">
</head>
<body>

<main class="app">
  <div id="map"></div>

  <!-- 上：検索・ヘルプ（ⓘ） -->
  <div class="top" id="top">
    <div class="toprow">
      <form class="search" id="qform" role="search">
        <button class="qback" id="qback" type="button" aria-label="戻る" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <svg class="qicon" id="qicon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="行き先・駅名で探す" aria-label="行き先・駅名で探す" aria-controls="qpanel">
        <button class="qclear" id="qclear" type="button" aria-label="行き先を消す" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </form>
      <button class="ctl helpbtn" id="helpBtn" type="button" aria-label="ヘルプ・このアプリについて"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/><circle cx="12" cy="7.6" r="1.25" fill="currentColor" stroke="none"/></svg></button>
    </div>
    <div class="qpanel" id="qpanel" hidden></div>
  </div>

  <!-- 右下：お気に入り（有料プラン。販売前は出さない）・タイマー・現在地 -->
  <div class="mapctl" id="mapctl">
    <button class="round favbtn" id="favBtn" type="button" aria-label="お気に入りの一覧" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z" fill="currentColor"/></svg><i class="lock" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></i></button>
    <button class="round timerbtn" id="timerBtn" type="button" aria-label="タイマー"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 13l3-3M9.5 2.5h5"/></svg></button>
    <button class="round" id="locate" type="button" aria-label="現在地へ"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
  </div>

  <!-- 下（広い画面では左）：区間のカード -->
  <section class="cards" id="cards" aria-label="近くの区間">
    <p class="desttag" id="destTag" hidden></p>
    <div class="track" id="track"></div>
  </section>

  <!-- 区間の詳細 -->
  <section class="detail" id="detail" aria-label="区間の詳細" hidden>
    <div class="dsheet" id="dsheet"></div>
  </section>

  <!-- 「ここへ行く」：どの地図で案内するか（初回だけ） -->
  <div class="scrim" id="goScrim" hidden>
    <section class="gosheet" id="goSheet" role="dialog" aria-modal="true" aria-labelledby="goTitle"></section>
  </div>

  <!-- お気に入りの一覧（下から。地図は暗くしない） -->
  <section class="favsheet" id="favSheet" role="dialog" aria-label="お気に入り" hidden>
    <div class="fgrip" aria-hidden="true"></div>
    <div class="fhead"><h2>お気に入り</h2><button class="dclose" id="favClose" type="button" aria-label="閉じる"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="fbody" id="favBody"></div>
  </section>

  <!-- 購入・復元・「このアプリについて」（下から。地図は暗く） -->
  <div class="scrim" id="buyScrim" hidden>
    <section class="gosheet buysheet" id="buySheet" role="dialog" aria-modal="true" aria-labelledby="buyTitle"></section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <!-- タイマー -->
  <div class="tscrim" id="timerScrim" hidden></div>
  <section class="timer" id="timer" role="dialog" aria-modal="true" aria-label="タイマー" hidden></section>

  <div class="empty" id="empty" hidden>
    <div class="card">
      <h2>区間データを読み込めませんでした</h2>
      <p>通信状態を確かめて、ページを読み込み直してください。</p>
    </div>
  </div>
</main>

<script src="config.js?v=c646ceb0"></script>
<script src="vendor/leaflet.js?v=5a640ff8"></script>
<script src="vendor/maplibre-gl.js?v=ab00c849"></script>
<script src="vendor/leaflet-maplibre-gl.js?v=e79b564d"></script>
<script src="basemap.js?v=9b93e0b7"></script>
<script src="zones.js?v=0a80f9b4"></script>
<script src="pro.js?v=84d29893"></script>
<script src="app.js?v=7efc14a7"></script>
</body>
</html>
